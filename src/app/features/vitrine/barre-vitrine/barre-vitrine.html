<header class="barre">
  <div class="interieur">
    <a class="marque" href="#haut" (click)="choisir($event, 'haut')" [attr.aria-label]="'vitrine.barre.haut' | transloco">
      <span class="material-icons logo" aria-hidden="true">ballot</span>
      <span>Batulo</span>
    </a>

    <button
      type="button"
      class="bouton-menu"
      [attr.aria-expanded]="menuOuvert()"
      aria-controls="menu-vitrine"
      (click)="basculer()"
    >
      <span class="material-icons" aria-hidden="true">{{ menuOuvert() ? 'close' : 'menu' }}</span>
      <span class="visuellement-cache">{{ 'vitrine.barre.menu' | transloco }}</span>
    </button>

    <nav id="menu-vitrine" class="menu" [class.ouvert]="menuOuvert()" [attr.aria-label]="'vitrine.barre.sections' | transloco">
      <ul class="liens">
        @for (s of sections; track s.id) {
          <li><a [href]="'#' + s.id" (click)="choisir($event, s.id)">{{ s.libelle | transloco }}</a></li>
        }
      </ul>
      <div class="actions">
        <app-selecteur-langue />
        <a class="bouton contour" routerLink="/connexion">{{ 'auth.connexion.titre' | transloco }}</a>
        <a class="bouton plein" routerLink="/inscription">{{ 'auth.connexion.creerCompte' | transloco }}</a>
      </div>
    </nav>
  </div>
</header>
