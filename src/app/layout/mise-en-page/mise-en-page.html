<a class="lien-evitement" href="#contenu">Aller au contenu</a>

<app-barre-haut [boutonMenu]="petitEcran()" (basculerMenu)="tiroirOuvert.set(!tiroirOuvert())" />

<mat-sidenav-container class="conteneur">
  <mat-sidenav
    class="menu"
    [mode]="petitEcran() ? 'over' : 'side'"
    [opened]="!petitEcran() || tiroirOuvert()"
    [fixedInViewport]="petitEcran()"
    [fixedTopGap]="56"
    (closedStart)="tiroirOuvert.set(false)"
  >
    <app-menu-lateral [liens]="liens()" />
  </mat-sidenav>

  <mat-sidenav-content>
    <main id="contenu" tabindex="-1">
      @if (auth.role() === 'ADMIN') {
        <app-bandeau-abonnement />
      } @else if (auth.role() === 'GESTIONNAIRE' && auth.statutAbonnement() === 'EXPIRE') {
        <app-encadre type="avertissement" class="bandeau" role="status" icone="event_busy">
          <p>
            L’abonnement de votre entreprise est expiré : l’accès est en lecture seule. Votre
            administrateur doit le renouveler.
          </p>
        </app-encadre>
      }
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
